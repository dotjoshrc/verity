# Throwaway Redis for verity's own tests. Unlike verity's real stacks this
# publishes a port (on a random loopback port) so `go test` on the host can reach it.
services:
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "admin"]
    ports: ["127.0.0.1::6379"]
    healthcheck: {
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a admin ping | grep -q PONG"],
      interval: 1s,
      retries: 30,
    }
