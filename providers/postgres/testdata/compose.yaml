# Throwaway Postgres for verity's own tests. Unlike verity's real stacks this
# publishes a port (on a random loopback port) so `go test` on the host can reach it.
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: postgres }
    ports: ["127.0.0.1::5432"]
    healthcheck: {
      test: ["CMD-SHELL", "pg_isready -U postgres"],
      interval: 1s,
      retries: 30,
    }
