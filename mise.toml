[tools]
go = "1.27.3"
"go:github.com/sudorandom/fauxrpc/cmd/fauxrpc" = "latest"
golangci-lint = "2.15.0"

[tasks.lint]
run = ["golangci-lint run --timeout 5m", "cd cmd/verity && golangci-lint run --timeout 5m"]

[tasks.test]
run = "go test -v ./... ./cmd/verity/..."

# Verity's own tests that need real backends. The compose project names are fixed,
# so two concurrent runs of this task would collide. Unlike verity's stacks, these
# publish a port (on a random loopback port) so `go test` on the host can reach them.
[tasks.test-integration]
run = '''
set -e
pg="docker compose -f providers/postgres/testdata/compose.yaml -p verity-test-pg"
redis="docker compose -f providers/redis/testdata/compose.yaml -p verity-test-redis"
wiremock="docker compose -f providers/wiremock/testdata/compose.yaml -p verity-test-wiremock"
trap "$pg down -v; $redis down -v; $wiremock down -v" EXIT
$pg up -d --wait
$redis up -d --wait
$wiremock up -d --wait
export VERITY_TEST_POSTGRES="postgres://postgres:postgres@$($pg port db 5432)/postgres?sslmode=disable"
export VERITY_TEST_REDIS="redis://default:admin@$($redis port cache 6379)"
export VERITY_TEST_WIREMOCK="http://$($wiremock port mock 8080)"
go test -count=1 ./... ./cmd/verity/...
'''

[tasks.format]
run = "dprint fmt '**/*.{go,yaml,md}'"
